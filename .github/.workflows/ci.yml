name: CI

on:  
  push:
    branches: [master]
  pull_request:
    branches: [master]
  

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install uv 
        uses: astral-sh/setup-uv@v6

      - name: Install Dependencies 
        uses: uv sync --locked 

      - name: Run Tests
        uses: uv run python -m unittest discover -s tests -v 